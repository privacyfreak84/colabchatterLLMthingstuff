name: Python helper tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner and audio dependencies
        run: python -m pip install --upgrade pytest numpy soundfile pocketsphinx praat-parselmouth pypdf reportlab
      - name: Run helper tests
        run: python -m pytest -q
      - name: Upload archive for transfer
        uses: actions/upload-artifact@v4
        with:
          name: Buddhist_Yoga_reconnaissance
          path: Buddhist_Yoga_reconnaissance.zip
          if-no-files-found: error
          retention-days: 1
